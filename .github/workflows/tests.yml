name: Run Unit Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - dev
env:
    HUSKY: 0

jobs:
  run-tests:
    runs-on: ubuntu-latest
    container:
      image: node:16-alpine3.16

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install SO deps
      run: apk add curl bash

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '16.x'
        cache: 'yarn'

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

    - name: Install packages
      run: yarn install --immutable --prefer-offline
    
    - name: Run unit tests 
      run: yarn test:ci

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage_unit_report
        path: coverage/lcov.info
        retention-days: 1
  sonarqube:
    needs: run-tests
    name: SonarQube
    runs-on: [self-hosted, sonarqube]
    timeout-minutes: 5
    container:
      image: ubuntu:18.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage_unit_report
      - name: fix code coverage paths - lcov.info
        run: sed -i 's:/__w/grafana-plugin/grafana-plugin/:/github/workspace/:' lcov.info
      - uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}  